# Catppuccin Mocha - tmux for kitty tabs
# Prefix C-a like screen, also keep C-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Kitty-like tab bindings (Ctrl+Shift+t/w, Ctrl+Tab)
bind -n C-S-t new-window
bind -n C-S-w kill-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Basics
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 10000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB,kitty:RGB"

# --- Opencode / Kitty keyboard protocol ---
# Required for shift+enter / ctrl+enter to be distinguished from plain enter
# and for Esc (session_interrupt) double-press to work reliably.
# Without these, tmux strips the CSI u sequences (\x1b[13;2u) that kitty sends.
# See: https://github.com/anomalyco/opencode/issues/1505 and #3699
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -s escape-time 10
set -g focus-events on
# Explicit fallback bindings (send CSI u directly) - covers cases where
# extended-keys negotiation fails but kitty still sends the sequence
bind -n S-Enter send-keys "\e[13;2u"
bind -n C-Enter send-keys "\e[13;5u"

# Catppuccin Mocha - simple mocha status without full plugin
source-file ~/.config/tmux/catppuccin-mocha.conf
set -g status off
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g window-status-style "bg=#313244,fg=#a6adc8"
set -g window-status-current-format " #I:#W ● "
set -g window-status-format " #I:#W  "
set -g window-status-separator ""
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-right "#[fg=#45475a]#[bg=#45475a,fg=#cdd6f4] %H:%M #[bg=#45475a,fg=#cba6f7]#[bg=#cba6f7,fg=#1e1e2e]  #H "
set -g status-left-length 100
set -g status-right-length 100

# Reload with Prefix+r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
