# --- Terminal ---
# xterm-kitty is REQUIRED for opencode to receive distinct shift+enter / ctrl+enter
# (Kitty keyboard protocol - CSI u). xterm-256color breaks it and makes shift+enter
# look like plain enter, and can also affect Esc handling.
term xterm-kitty

# --- Window ---
hide_window_decorations yes
background_opacity 0.85
confirm_os_window_close 0

# --- Tab bar (disabled) ---
tab_bar_style hidden
map ctrl+shift+t no_op

# --- Font ---
font_family CaskaydiaCove NF
font_size 12
# WezTerm's freetype_load_target="Light" + freetype_render_target="HorizontalLcd"
# has no direct Kitty equivalent. Kitty handles hinting/subpixel automatically.
# If the rendering looks off, try:
# font_hinting auto

# --- Cursor ---
cursor_shape block
cursor_blink_rate 700
# cursor #ebdbb2
# cursor_text_color #282828

# --- Color scheme (gruvbox dark) ---
background #282828
foreground #ebdbb2
selection_background #504945
selection_foreground #ebdbb2
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
cursor #ebdbb2
cursor_text_color #282828

# --- Keybindings ---
# WezTerm's disable_default_key_bindings has no Kitty equivalent.
# Just map what you need; everything else stays at defaults.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Kitty native tabs (powerline) - tmux status off, so kitty handles Ctrl+Shift+t
# map ctrl+shift+t no_op  # disabled to let kitty new_tab work

# --- Opencode: shift+enter / ctrl+enter ---
# Ensure Kitty sends Kitty keyboard protocol sequences (CSI u) even without
# the protocol enabled, so opencode can distinguish them from plain enter.
# opencode expects: shift+enter = \x1b[13;2u , ctrl+enter = \x1b[13;5u
# See: https://github.com/anomalyco/opencode/issues/1505
map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u

# --- Cursor trail ---
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- Misc ---
# WezTerm's animation_fps=90 → Kitty's repaint_delay (ms between frames)
repaint_delay 0   


# BEGIN_KITTY_THEME
# END_KITTY_THEME

# --- Cursor color (gruvbox crash-yellow for visibility) ---
cursor #ebdbb2
cursor_text_color #282828


# BEGIN_KITTY_FONTS
#font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# --- Window borders (compositor can't outline native Wayland windows, so kitty draws its own) ---
window_border_width 2px
draw_minimal_borders no
active_border_color #928374
inactive_border_color #504945
