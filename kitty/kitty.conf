# --- Terminal ---
term xterm-256color

# --- Window ---
hide_window_decorations yes
background_opacity 0.85
confirm_os_window_close 0

# --- Tab bar ---
tab_bar_style powerline
tab_bar_edge top
tab_bar_margin_width 4
tab_bar_margin_height 4 4
tab_powerline_style slanted
tab_bar_min_tabs 1
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{title}[{index}]"

# --- Font ---
font_family CaskaydiaCove NF
font_size 12
# WezTerm's freetype_load_target="Light" + freetype_render_target="HorizontalLcd"
# has no direct Kitty equivalent. Kitty handles hinting/subpixel automatically.
# If the rendering looks off, try:
# font_hinting auto

# --- Cursor ---
cursor_shape block
cursor_blink_rate 700
# cursor #d99abb
# cursor_text_color #1e1e2e

# --- Color scheme (built-in since Kitty >= 0.26) ---
theme Catppuccin-Macchiato
cursor #d99abb
cursor_text_color #1e1e2e

# --- Keybindings ---
# WezTerm's disable_default_key_bindings has no Kitty equivalent.
# Just map what you need; everything else stays at defaults.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Kitty native tabs (powerline) - tmux status off, so kitty handles Ctrl+Shift+t
# map ctrl+shift+t no_op  # disabled to let kitty new_tab work

# --- Cursor trail ---
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- Misc ---
# WezTerm's animation_fps=90 → Kitty's repaint_delay (ms between frames)
repaint_delay 0   


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# --- Cursor color (overrides theme, matches wezterm/nvim #d99abb) ---
cursor #d99abb
cursor_text_color #1e1e2e


# BEGIN_KITTY_FONTS
#font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
